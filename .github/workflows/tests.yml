name: Tests

on:
  push:
    branches:
      - main
      - develop
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        if: matrix.php == '8.4'
        run: composer validate --strict

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node
        if: matrix.php == '8.4'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        if: matrix.php == '8.4'
        run: npm ci --prefix frontend

      - name: Audit production frontend dependencies
        if: matrix.php == '8.4'
        run: npm audit --prefix frontend --omit=dev --audit-level=moderate

      - name: Lint Angular frontend
        if: matrix.php == '8.4'
        run: npm run lint:frontend

      - name: Test Angular frontend
        if: matrix.php == '8.4'
        run: npm run test:frontend

      - name: Test performance tools
        if: matrix.php == '8.4'
        run: npm run test:performance-tools

      - name: Build Angular frontend
        if: matrix.php == '8.4'
        run: npm run build:frontend

      - name: Execute deterministic capacity contracts
        if: matrix.php == '8.4'
        run: php -d memory_limit=512M vendor/bin/pest tests/Feature/Performance

      - name: Execute tests
        run: php -d memory_limit=512M vendor/bin/pest

  production-runtime:
    name: MySQL 8.4 / Redis production contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: procura_ci_github
          MYSQL_USER: procura_ci
          MYSQL_PASSWORD: procura-ci-password
          MYSQL_ROOT_PASSWORD: procura-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=procura-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: procura_ci_github
      DB_USERNAME: procura_ci
      DB_PASSWORD: procura-ci-password
      DB_TIMEZONE: +00:00
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      OPERATIONS_READINESS_DATABASE_CONNECTION: mysql
      OPERATIONS_READINESS_CACHE_STORE: redis
      OPERATIONS_DASHBOARD_CACHE_STORE: redis
      ANALYSIS_SUBMISSION_ENABLED: true
      PROCURA_TEST_MYSQL_ENABLED: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo_mysql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Apply the real MySQL migration ledger
        run: php artisan migrate:fresh --force

      - name: Verify cached MySQL and Redis readiness
        run: |
          php artisan optimize
          php artisan operations:readiness --json
          php artisan optimize:clear

      - name: Execute MySQL runtime contract
        env:
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php -d memory_limit=512M vendor/bin/pest tests/Integration/MySqlRuntimeContractTest.php
