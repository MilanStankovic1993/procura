name: Tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node
        if: matrix.php == '8.4'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        if: matrix.php == '8.4'
        run: npm ci --prefix frontend

      - name: Audit production frontend dependencies
        if: matrix.php == '8.4'
        run: npm audit --prefix frontend --omit=dev --audit-level=moderate

      - name: Lint Angular frontend
        if: matrix.php == '8.4'
        run: npm run lint:frontend

      - name: Test Angular frontend
        if: matrix.php == '8.4'
        run: npm run test:frontend

      - name: Build Angular frontend
        if: matrix.php == '8.4'
        run: npm run build:frontend

      - name: Execute deterministic capacity query budgets
        if: matrix.php == '8.4'
        run: php -d memory_limit=512M vendor/bin/pest tests/Feature/Performance/CapacityBaselineTest.php

      - name: Execute tests
        run: php -d memory_limit=512M vendor/bin/pest
